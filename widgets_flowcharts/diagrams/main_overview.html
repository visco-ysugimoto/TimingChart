<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>main.dart 全体図（Mermaid）</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP",
          "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        margin: 24px;
        line-height: 1.5;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .btn {
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
        color: CanvasText;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .note {
        color: color-mix(in srgb, CanvasText 70%, transparent);
        font-size: 12px;
        margin: 0 0 12px 0;
      }
      #render {
        border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        border-radius: 12px;
        padding: 12px;
        overflow: auto;
        background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>main.dart からの全体図（SVG）</h1>
      <button id="downloadSvg" class="btn" disabled>SVGをダウンロード</button>
    </header>

    <p class="note">
      このHTMLはローカルの <code>main_overview.svg</code> を表示します（ネット不要）。
    </p>

    <div id="render" aria-label="Rendered diagram"></div>

    <script type="module">
      const renderEl = document.getElementById("render");
      const downloadBtn = document.getElementById("downloadSvg");
      const svgPath = "./main_overview.svg";

      const render = async () => {
        const res = await fetch(svgPath, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`SVG の読み込みに失敗しました: ${res.status} ${res.statusText}`);
        }
        const svg = await res.text();
        renderEl.innerHTML = svg;
        downloadBtn.disabled = false;

        downloadBtn.onclick = () => {
          const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "main_overview.svg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        };
      };

      render().catch((e) => {
        renderEl.textContent =
          "SVGの表示に失敗しました。\n" +
          "ファイルを直接開いている場合、ブラウザが fetch をブロックすることがあります。\n" +
          "その場合は VS Code の Live Server などでフォルダを配信して開いてください。\n\n" +
          String(e);
      });
    </script>
  </body>
</html>
